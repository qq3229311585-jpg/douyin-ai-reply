<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 怼 界面方案</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0e0e11;color:#ddd;font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC",sans-serif;padding:28px}
h1{font-size:15px;font-weight:600;margin-bottom:4px;color:#fff}
.sub{color:#888;margin-bottom:22px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,340px);gap:28px;margin-bottom:34px}
.cap{margin-bottom:10px;font-size:12px;color:#aaa}.cap b{color:#fff;font-weight:600;font-size:13px}
.stage{padding:18px;border-radius:14px;background:#2a2d3a}
.stage.l{background:#e9e9ec}

/* 通用面板骨架,颜色全部走变量 */
.p{width:320px;padding:0 12px 12px;border-radius:var(--r);background:var(--bg);color:var(--fg);border:1px solid var(--bd);box-shadow:var(--sh);font-size:13px}
.head{display:flex;justify-content:space-between;align-items:center;margin:0 -12px 10px;padding:10px 8px 8px 14px;border-bottom:1px solid var(--bd);font-weight:600}
.tools{display:flex;gap:2px;color:var(--mu)}.tools i{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;font-style:normal;border-radius:6px}
.in,.sel{width:100%;height:32px;padding:0 10px;border:1px solid var(--bd);border-radius:var(--rs);background:var(--inbg);color:var(--mu);font-size:12px;display:flex;align-items:center;justify-content:space-between}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.btn{height:32px;padding:0 16px;border-radius:var(--rs);background:var(--pri);color:var(--prifg);font-size:12px;font-weight:500;display:flex;align-items:center}
.topic{margin:10px 0;padding:2px 0 2px 10px;border-left:2px solid var(--bd2);color:var(--mu);font-size:12px;line-height:1.6}
.card{position:relative;margin-top:8px;padding:9px 12px 9px 34px;border-radius:var(--rc);background:var(--card);border:1px solid var(--bd);line-height:1.55}
.card:first-of-type{margin-top:0}
.card::before{content:attr(data-n);position:absolute;left:12px;top:9px;font-size:11px;line-height:20px;color:var(--mu)}
.card.h{background:var(--hv);border-color:var(--bd2)}
.card.h::after{content:"填入 ↵";position:absolute;right:10px;top:9px;font-size:11px;line-height:20px;color:var(--mu)}

/* A:Basecoat / shadcn(zinc 以外的纯中性灰,色值来自 shadcn globals.css) */
.A.d{--bg:#0a0a0a;--card:#171717;--hv:#262626;--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.2);--fg:#fafafa;--mu:#a3a3a3;--pri:#e5e5e5;--prifg:#171717;--inbg:rgba(255,255,255,.04);--r:12px;--rs:8px;--rc:10px;--sh:0 10px 30px rgba(0,0,0,.5)}
.A.l{--bg:#fff;--card:#fafafa;--hv:#f5f5f5;--bd:#e5e5e5;--bd2:#d4d4d4;--fg:#0a0a0a;--mu:#737373;--pri:#171717;--prifg:#fafafa;--inbg:#fff;--r:12px;--rs:8px;--rc:10px;--sh:0 10px 30px rgba(0,0,0,.12)}
/* B:Radix Gray 12 级色阶(色值来自 @radix-ui/colors gray / gray-dark) */
.B.d{--bg:#111;--card:#191919;--hv:#222;--bd:#2a2a2a;--bd2:#3a3a3a;--fg:#eee;--mu:#7b7b7b;--pri:#eee;--prifg:#111;--inbg:#191919;--r:8px;--rs:6px;--rc:6px;--sh:0 8px 24px rgba(0,0,0,.5)}
.B.l{--bg:#fcfcfc;--card:#f9f9f9;--hv:#f0f0f0;--bd:#e0e0e0;--bd2:#cecece;--fg:#202020;--mu:#838383;--pri:#202020;--prifg:#fcfcfc;--inbg:#fcfcfc;--r:8px;--rs:6px;--rc:6px;--sh:0 8px 24px rgba(0,0,0,.12)}
/* C:偏终端(我自己配的,Claude Code 那种暖灰 + 一点点陶土色,不属于任何库) */
.C.d{--bg:#1f1e1d;--card:#262524;--hv:#2f2d2b;--bd:#35332f;--bd2:#4a4743;--fg:#ece9e4;--mu:#9a958c;--pri:#d97757;--prifg:#1f1e1d;--inbg:#262524;--r:10px;--rs:6px;--rc:6px;--sh:0 10px 30px rgba(0,0,0,.5)}
.C.l{--bg:#faf9f5;--card:#f3f1ea;--hv:#ebe8df;--bd:#e3dfd3;--bd2:#d0cbbb;--fg:#29261f;--mu:#85806f;--pri:#c15f3c;--prifg:#faf9f5;--inbg:#faf9f5;--r:10px;--rs:6px;--rc:6px;--sh:0 10px 30px rgba(0,0,0,.12)}
</style></head><body>
<h1>AI 怼 · 界面方案</h1>
<div class="sub">上排深色(放在抖音深色界面上),下排浅色。三版内容一样,只是配色和圆角不同。</div>
<div class="grid" id="g"></div>
<script>
const names={A:["A · Basecoat / shadcn 风","色值取自 shadcn/ui 主题(4.4k★ Basecoat 同源),纯中性灰,圆角偏大,主按钮是浅灰反色"],B:["B · Radix 灰阶","色值取自 Radix Colors 的 gray 12 级色阶,更紧凑、更硬朗,圆角小"],C:["C · 偏终端的暖灰","我自己配的,类似 Claude Code 的暖灰底,只有主按钮用一点陶土色"]};
const panel=c=>`<div class="p ${c}">
 <div class="head"><span>AI 怼</span><span class="tools"><i>⚙</i><i>✕</i></span></div>
 <div class="in">我想表达的意思(可选)</div>
 <div class="row"><div class="sel"><span style="color:inherit;opacity:.9">以理服人</span><span>▾</span></div><div class="btn">生成</div></div>
 <div class="topic">梦泪11周年被整蛊仪式,评论区讨论官方执意让梦泪站C位</div>
 <div class="card" data-n="1">不唱不跳站C位就叫执着?那叫没节目硬凑人</div>
 <div class="card h" data-n="2">官方请得起大牌却让他干站着,你管这叫重视?</div>
 <div class="card" data-n="3">每年都知道拦不住,那这不叫仪式叫例行整活</div>
</div>`;
let h="";
for(const t of ["d","l"])for(const k of "ABC"){
  h+=`<div><div class="cap"><b>${names[k][0]}</b> ${t=="d"?"· 深色":"· 浅色"}<br>${t=="d"?names[k][1]:""}</div><div class="stage ${t}">${panel(k+" "+t)}</div></div>`;
}
document.getElementById("g").innerHTML=h;
</script></body></html>
